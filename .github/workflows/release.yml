name: Release

# Publish a GitHub release with prebuilt CLI binaries whenever a version tag
# (vX.Y.Z) is pushed. Tags belong on main's release merge commits (see
# docs/git_flow.md), and the "tag is on main" job enforces it: a tag whose
# commit is not on main fails the run and nothing is published. macOS only
# (unsigned) for now, both architectures built on the arm64 runner; more
# targets and signing as we iterate.
#
# workflow_dispatch runs the build matrix as a dry run: it compiles and
# packages the binaries but skips the publish job (no tag, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A release must correspond to a released state of the code: refuse any
  # v* tag whose commit is not part of main's history (e.g. a tag placed on
  # dev by mistake). The publish job requires this to pass.
  verify:
    name: tag is on main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          # ^{commit} peels annotated tags to the commit they point at.
          COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          if git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "ok: $GITHUB_REF_NAME points to a commit on main"
          else
            echo "Refusing to release: tag $GITHUB_REF_NAME points to $COMMIT, which is not on main"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Both architectures build on the arm64 runner: Apple's toolchain links
    # either arch natively (rustup target add is enough), and GitHub retired
    # macos-13, the last free Intel image, in December 2025.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the CLI
        run: cargo build -p collapse-cli --release --target ${{ matrix.target }}

      - name: Package binary and checksum
        run: |
          ARCHIVE="collapse-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE" collapse
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            collapse-*.tar.gz
            collapse-*.sha256

  release:
    name: publish release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
