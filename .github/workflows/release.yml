name: Release

# Publish a GitHub release whenever a version tag (vX.Y.Z) is pushed: the CLI
# binaries (per-arch macOS tarballs) and the desktop app (one universal macOS
# .dmg, plus Linux .deb/.rpm packages for x86_64). Tags belong on main's
# release merge commits (see docs/git_flow.md), and the "tag is on main" job
# enforces it: a tag whose commit is not on main fails the run and nothing is
# published. Everything unsigned for now; signing as we iterate.
#
# workflow_dispatch is a dry run: it compiles and packages the binaries but
# never publishes; the verify and publish jobs also require the push event,
# so even a dispatch pointed at a tag ref cannot release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Only the publish job needs to write (it gets contents: write per-job);
# build jobs run third-party build scripts and should hold a read-only token.
permissions:
  contents: read

# One run per ref at a time, so a delete-and-retag cannot race an in-flight
# run for the same tag name.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release must correspond to a released state of the code: refuse any
  # v* tag whose commit is not part of main's history (e.g. a tag placed on
  # dev by mistake). The publish job requires this to pass.
  verify:
    name: tag is on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          # Re-fetch tags: actions/checkout is known to mangle annotated-tag
          # objects (actions/checkout#290). ^{commit} then peels either tag
          # kind to the commit it points at (GITHUB_SHA is the tag object,
          # not the commit, for annotated tags).
          git fetch --tags --force --quiet origin
          COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          if git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "ok: $GITHUB_REF_NAME points to a commit on main"
          else
            echo "Refusing to release: tag $GITHUB_REF_NAME points to $COMMIT, which is not on main"
            exit 1
          fi

      - name: Check the tag matches the CLI version
        run: |
          # The binary reports CARGO_PKG_VERSION via --version; a tag that
          # does not match it would ship a binary claiming another version.
          CRATE_VERSION=$(grep -m1 '^version' apps/cli/Cargo.toml | cut -d'"' -f2)
          if [ "v$CRATE_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "ok: apps/cli/Cargo.toml is at $CRATE_VERSION"
          else
            echo "Refusing to release: tag is $GITHUB_REF_NAME but apps/cli/Cargo.toml says $CRATE_VERSION (bump it before tagging)"
            exit 1
          fi

      - name: Check the tag matches the desktop version
        run: |
          # tauri.conf.json's version names the bundles (Collapse_X.Y.Z_...);
          # a mismatched tag would ship a .dmg claiming another version.
          APP_VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$APP_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "ok: the desktop app is at $APP_VERSION"
          else
            echo "Refusing to release: tag is $GITHUB_REF_NAME but tauri.conf.json says $APP_VERSION (bump it before tagging)"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Both architectures build on the arm64 runner: Apple's toolchain links
    # either arch natively (rustup target add is enough), and GitHub retired
    # macos-13, the last free Intel image, in December 2025.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build first: the make target builds with --locked, so a drifted
      # Cargo.lock fails the run here, before any other cargo command could
      # quietly re-resolve and rewrite it on the runner.
      - name: Build the CLI
        run: make cli/release TARGET=${{ matrix.target }}

      # The CI suite runs on Linux; run it once on the OS we actually ship
      # (native arch only; the cross-built binary shares the same code).
      - name: Test on macOS
        if: matrix.target == 'aarch64-apple-darwin'
        run: make test/rust

      - name: Package binary and checksum
        run: |
          # Dry runs happen on feature/* branches: flatten slashes so the
          # ref name cannot become a directory in the archive path.
          NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE="collapse-${NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE" collapse
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            collapse-*.tar.gz
            collapse-*.sha256

  # The desktop app ships as ONE universal .dmg (arm64 + Intel via lipo,
  # `--target universal-apple-darwin`), the macOS convention for apps, unlike
  # the CLI's per-arch tarballs. Unsigned for now: first run needs right-click
  # Open (or removing the quarantine attribute) until we sign and notarize.
  build-desktop:
    name: build (desktop, universal dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # make handles npm ci (via its node_modules dependency) and the Tauri
      # invocation; the workflow stays free of per-app tooling details.
      - name: Build the app
        run: make desktop/bundle

      - name: Checksum the dmg
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: |
          DMG=$(ls *.dmg)
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-universal
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha256

  # Linux desktop packages: a .deb and an .rpm for x86_64, built on the Ubuntu
  # runner with the same Tauri system dependencies CI installs. Tauri names
  # them from productName + version (Collapse_X.Y.Z_amd64.deb,
  # Collapse-X.Y.Z-1.x86_64.rpm). No AppImage for now (its bundler pulls
  # extra tooling); arm64 needs an arm runner — both can come later.
  build-desktop-linux:
    name: build (desktop, deb + rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build the packages
        run: make desktop/bundle-linux

      # cd into each bundle dir so the .sha256 records the bare filename and
      # `shasum -c` works next to the downloaded package.
      - name: Checksum the packages
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          (cd deb && DEB=$(ls *.deb) && shasum -a 256 "$DEB" > "$DEB.sha256")
          (cd rpm && RPM=$(ls *.rpm) && shasum -a 256 "$RPM" > "$RPM.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/*.sha256
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/rpm/*.sha256

  release:
    name: publish release
    needs: [verify, build, build-desktop, build-desktop-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
