name: test-and-build

# Per app: run its tests, and only if they pass, build it. Everything runs on
# Linux runners; the macOS artifacts are the release workflow's job. The
# landing has no test suite and is built by deploy-landing.yml instead.
on:
  push:
    branches: [main, dev]
  # `labeled` is not in the default set, and without it the `full-matrix` label
  # below would be a documented escape hatch that never fires: adding a label
  # would change nothing until the next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Lets anyone run the full matrix on demand. GitHub only offers this once the
  # workflow is on the default branch, so it is here for later rather than now.
  workflow_dispatch:

jobs:
  # The one job that is not per-app, and so the one exception to the naming
  # convention below. It runs first and everything else waits on it: rustfmt
  # needs no build, so it answers in seconds, and a tree that has to be pushed
  # again anyway is not worth a runner compiling Tauri for four minutes.
  #
  # It exists because the tree drifted out of rustfmt once already, and then a
  # second time within the hour: two PRs that were each formatted correctly were
  # merged one after the other, and git combined them textually, which is all it
  # can do. Only a check that runs on the merged result catches that.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Covers both workspaces: apps/desktop/src-tauri is its own, so a plain
      # --all at the root does not reach it.
      - name: Check formatting
        run: make fmt/check

  # -------------------------------------------------------------------------
  # Tests: one job per app, plus the cross-platform pair at the end of the
  # block. Job display names follow one convention, `test (<app>)` and
  # `build (<app>)`, so a check's name says what it does and which app it
  # belongs to.
  # -------------------------------------------------------------------------
  # Gate: the shared engine must pass before anything downstream runs.
  test-core:
    name: test (core)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test collapse-core
        run: make core/test

  # The remote client sits between core and the front-ends that talk to a
  # server, so it gates nothing but is tested alongside them.
  test-remote:
    name: test (remote)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test collapse-remote
        run: make remote/test

  # Runs only if core passed; parallel with the desktop suite.
  test-cli:
    name: test (cli)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test collapse-cli
        run: make cli/test

  # Runs only if core passed; parallel with the cli and desktop suites.
  test-server-backend:
    name: test (server-backend)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test collapse-server-backend
        run: make server-backend/test

  # The web frontend is Node only: it talks to the backend over HTTP and
  # mocks that in tests, so it needs no Rust at all.
  test-server-frontend:
    name: test (server-frontend)
    # No Rust of its own, but it waits on fmt like everything else: if the tree
    # needs another push, nothing should have started.
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/server-frontend/package-lock.json

      - name: Run Vitest
        run: make server-frontend/test

  # Runs only if core passed; parallel with cli. Frontend tests mock the Tauri
  # IPC, so this needs Node only — no Tauri system dependencies.
  test-desktop:
    name: test (desktop)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Run Vitest
        run: make desktop/test

  # The src-tauri crate's own suite: the commands, the same_file guard, the
  # remote path against a real server backend, and the JS/Rust IPC lockstep.
  # Unlike the Vitest job this compiles Tauri, so it needs the system libraries
  # and the frontend bundle (make desktop/test-rust builds the bundle first).
  test-desktop-rust:
    name: test (desktop, rust)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo (desktop workspace)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Run the Rust suite
        run: make desktop/test-rust

  # Last of the test jobs, and the only one that does not always run: the whole
  # Rust suite on the two platforms Linux cannot speak for. Linux
  # runs it on every push and every pull request; these two are reserved for
  # the branches that ship, because a macOS or Windows runner costs several
  # times a Linux one in billed minutes and feature work does not need them.
  #
  # They run when the code is on, or heading to, a shipping branch:
  #   - any push to dev or main (the `on:` block already limits pushes to those)
  #   - a pull request FROM dev (the release PR into main), from main (a
  #     back-merge) or from a release/* branch
  # A pull request from feature/* or hotfix/* therefore stays Linux only, and
  # picks these up when it lands on dev. When such a branch does touch
  # platform-specific code, label the pull request `full-matrix` to ask for
  # them anyway rather than renaming the branch.
  #
  # Windows is where the file identity guard matters most: NTFS hardlinks are
  # the case it exists for, and the comparison was #[cfg(unix)], so the guard
  # did not exist there at all. macOS is where the .dmg ships, and until now
  # nothing but a developer's own machine ever ran this suite there.
  test-cross:
    name: test (rust, ${{ matrix.label }})
    needs: test-core
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'dev' ||
      github.head_ref == 'main' ||
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-matrix')
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Both runner images already carry what Tauri needs: Xcode command line
      # tools on macOS, and the MSVC toolchain, the Windows SDK that
      # tauri-winres needs for rc.exe, and WebView2 on Windows. These tests
      # never open a window.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # runner.os distinguishes these from each other and from the Linux jobs,
      # so the three cannot collide despite the shared suffix.
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-

      # bash, not pwsh, for the same reason release.yml's Windows job says so:
      # the make targets assume a POSIX shell, and Git Bash on PATH is what
      # makes GNU make pick sh.exe for its recipes instead of cmd.exe. Harmless
      # on macOS, where bash is the default anyway.
      - name: Run the workspace suite
        shell: bash
        run: make test/rust

      # Separate step so a failure says which half broke without reading a log.
      - name: Run the desktop suite
        shell: bash
        run: make desktop/test-rust

  # -------------------------------------------------------------------------
  # Builds: each app builds only after its own tests pass.
  # -------------------------------------------------------------------------
  build-core:
    name: build (core)
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collapse-core
        run: make core/build

  build-remote:
    name: build (remote)
    needs: test-remote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collapse-remote
        run: make remote/build

  build-cli:
    name: build (cli)
    needs: test-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collapse-cli
        run: make cli/build

  build-server-backend:
    name: build (server-backend)
    needs: test-server-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collapse-server-backend
        run: make server-backend/build

  build-server-frontend:
    name: build (server-frontend)
    needs: test-server-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/server-frontend/package-lock.json

      - name: Build the web frontend
        run: make server-frontend/build

  # Compiles the whole desktop app (frontend + the src-tauri Rust crate,
  # which no other CI job compiles) without bundling installers. Needs the
  # Tauri system libraries on Linux.
  build-desktop:
    name: build (desktop)
    needs: [test-desktop, test-desktop-rust]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo (desktop workspace)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Compile the desktop app
        run: make desktop/compile
