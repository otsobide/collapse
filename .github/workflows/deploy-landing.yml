name: Deploy landing

# Build the Nuxt landing and publish the compiled static site to a branch that
# holds only the build output:
#   - push to main → pages/landing       (production)
#   - push to dev  → pages/landing-dev    (staging, to preview before main)
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# One deploy per source branch at a time; don't let main and dev cancel each other.
concurrency:
  group: deploy-landing-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Build the landing
        run: make landing/build

      - name: Publish build output
        working-directory: apps/landing/.output/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main goes to production; every other branch (dev) goes to staging.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET="pages/landing"
          else
            TARGET="pages/landing-dev"
          fi
          echo "Publishing $GITHUB_REF_NAME → $TARGET"

          # .nojekyll lets a static host serve Nuxt's _nuxt/ asset directory.
          touch .nojekyll
          git init -q -b "$TARGET"
          # Attribute the published build to the repo owner (links to the
          # GitHub profile via the account's noreply email), not a bot.
          git config user.name "Javier Parada"
          git config user.email "19194763+otsobide@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy landing from ${GITHUB_REF_NAME}@${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
