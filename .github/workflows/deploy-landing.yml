name: Deploy landing

# Build the Nuxt landing and publish the compiled static site to the
# `pages/landing` branch (which holds only the build output). Runs on every
# push to main, and can be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Build the landing
        working-directory: apps/landing
        run: |
          npm ci
          npm run generate

      - name: Publish build output to pages/landing
        working-directory: apps/landing/.output/public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .nojekyll lets a static host serve Nuxt's _nuxt/ asset directory.
          touch .nojekyll
          git init -q -b pages/landing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy landing from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages/landing
