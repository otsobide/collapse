[package]
name = "collapse-cli"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "collapse"
path = "src/main.rs"

[lib]
name = "collapse_cli"
path = "src/lib.rs"

[dependencies]
collapse-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# Integration tests (tests/) drive the real clap parser and verify with core.
[dev-dependencies]
collapse-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
