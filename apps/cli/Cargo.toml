[package]
name = "collapse-cli"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "collapse"
path = "src/main.rs"

[lib]
name = "collapse_cli"
path = "src/lib.rs"

[dependencies]
collapse-core = { path = "../core" }
# Remote compression (--server); the exchange itself lives in collapse-remote
# so the desktop app can reuse it.
collapse-remote = { path = "../remote" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# Integration tests (tests/) drive the real clap parser and verify with core;
# the remote tests (tests/remote.rs) serve the real collapse-api router
# in-process on an ephemeral port.
[dev-dependencies]
collapse-core = { path = "../core" }
collapse-api = { path = "../api" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
axum = "0.8"
