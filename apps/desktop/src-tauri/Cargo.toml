[package]
name = "collapse-desktop"
version = "0.7.0"
edition = "2021"
description = "Collapse — a small, fast file compressor"
authors = ["cervantic"]
license = "GPL-3.0-only"

# Standalone workspace: kept out of the root Cargo workspace so a plain
# `cargo test` at the repo root (core + CLI) does not need the Tauri system
# dependencies. The desktop app is built with its own toolchain.
[workspace]

[lib]
name = "collapse_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
collapse-core = { path = "../../core" }
# Remote compression. The HTTP lives here rather than in the webview, so the
# app's CSP stays `default-src 'self'` and no network capability is needed.
collapse-remote = { path = "../../remote" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Integration tests (tests/) drive the commands through the crate's public
# API. tests/remote.rs serves a real collapse-server-backend in-process on an
# ephemeral port, the same way the CLI and collapse-remote test their own
# halves of that exchange; a path dependency reaches across this crate's
# workspace boundary without trouble.
[dev-dependencies]
collapse-server-backend = { path = "../../server-backend" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
axum = "0.8"
# tests/names.rs crafts an archive holding an entry name this host cannot
# write, which no compression of a real directory could ever produce: the
# filesystem would have refused the file first. Same version core already
# builds with, so this adds nothing to the dependency tree.
zip = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
