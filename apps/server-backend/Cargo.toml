[package]
name = "collapse-server-backend"
version = "0.8.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "collapse-server-backend"
path = "src/main.rs"

[lib]
name = "collapse_server_backend"
path = "src/lib.rs"

[dependencies]
collapse-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "sync",
    "fs",
    "time",
    # A stop has to be caught to be handled: without this the process is
    # terminated mid-response.
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
# Logging. tracing is the Tokio ecosystem's own facade, tracing-subscriber
# renders it (timestamp, level, target) and filters it through RUST_LOG, and
# tower-http's TraceLayer turns each HTTP exchange into one line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
# The job registry. "bundled" compiles SQLite into the binary, so the runtime
# image needs no libsqlite3 and every platform gets the same version.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Integration tests (tests/) drive the router in-process and verify the
# responses round-trip through the core extractors.
[dev-dependencies]
collapse-core = { path = "../core" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
# tests/security.rs crafts hostile tar envelopes by hand.
tar = "0.4"
# tests/registry.rs reads the database back with a plain SQLite client, to
# check what the server wrote rather than what its own code says it wrote.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# tests/e2e.rs talks to the real binary over a real socket, so it needs an
# HTTP client of its own. ureq is the one collapse-remote already uses.
ureq = "2"
