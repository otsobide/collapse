# Serve the built SPA and proxy the API to the backend.
#
# This is what keeps the browser on ONE origin: the app fetches /compress and
# /jobs from the same host it was served from, so no CORS is involved and the
# backend keeps its deliberate no-CORS posture.

server {
    listen 8080;
    server_name _;

    # Uploads are whole files. nginx defaults to 1 MiB, which would turn any
    # real archive into a 413 long before the backend's own cap applies.
    client_max_body_size 2048m;
    # Hand the upload straight to the backend rather than spooling it to disk.
    proxy_request_buffering off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The backend's surface. COLLAPSE_BACKEND is substituted at container
    # start (see the entrypoint), so the service name is not baked into the
    # image.
    location ~ ^/(health|compress|jobs|openapi\.json|docs)(/|$) {
        proxy_pass http://${COLLAPSE_BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A job can take a while; do not cut it off mid-compression.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Stream the archive through instead of spooling it. Buffered (the
        # default) nginx writes every download to a temp file of its own before
        # feeding the client, so a 500 MB archive is written twice and the
        # proxy needs disk for a copy of whatever the backend just produced.
        proxy_buffering off;
    }
}
